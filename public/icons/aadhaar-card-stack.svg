<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60" fill="none">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0e6606"/>
    </linearGradient>
  </defs>

  <!-- BACK CARD (Layer 1, angled behind) -->
  <g transform="translate(14, 5) rotate(7, 30, 20)" filter="url(#cardShadow)">
    <!-- Card Body -->
    <rect x="0" y="0" width="58" height="36" rx="3.5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75"/>
    <!-- Top Tricolor Bar -->
    <rect x="0" y="0" width="58" height="3.5" rx="3.5" fill="url(#saffronGrad)"/>
    <rect x="0" y="2.5" width="58" height="1.2" fill="#FFFFFF"/>
    <rect x="0" y="3.7" width="58" height="2" fill="url(#greenGrad)"/>
    <!-- Back details mock lines -->
    <rect x="6" y="9" width="34" height="1.5" rx="0.75" fill="#94A3B8"/>
    <rect x="6" y="13" width="28" height="1.5" rx="0.75" fill="#CBD5E1"/>
    <rect x="6" y="17" width="22" height="1.5" rx="0.75" fill="#CBD5E1"/>
    <!-- Dark barcode / strip -->
    <rect x="6" y="24" width="46" height="5" rx="1" fill="#1E293B"/>
  </g>

  <!-- FRONT CARD (Layer 2, in front) -->
  <g transform="translate(6, 12)" filter="url(#cardShadow)">
    <!-- Card Body -->
    <rect x="0" y="0" width="60" height="38" rx="3.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.75"/>

    <!-- Top Tricolor Stripe -->
    <path d="M 0,3.5 Q 0,0 3.5,0 L 56.5,0 Q 60,0 60,3.5 L 60,3.5 L 0,3.5 Z" fill="url(#saffronGrad)"/>
    <rect x="0" y="3.5" width="60" height="1.2" fill="#FFFFFF"/>
    <rect x="0" y="4.7" width="60" height="2" fill="url(#greenGrad)"/>

    <!-- National Emblem (Ashoka Stambh) Top Left -->
    <g transform="translate(3, 8) scale(0.65)">
      <path d="M 3,1 L 5,1 L 5,6 L 3,6 Z" fill="#0F172A"/>
      <path d="M 1,2 L 3,2 L 3,6 L 1,6 Z" fill="#0F172A"/>
      <path d="M 5,2 L 7,2 L 7,6 L 5,6 Z" fill="#0F172A"/>
      <rect x="0.5" y="6" width="7" height="1.2" fill="#0F172A"/>
      <rect x="1.5" y="7.5" width="5" height="1" fill="#0F172A"/>
    </g>

    <!-- Center Aadhaar Sunburst Logo -->
    <g transform="translate(36, 12)">
      <!-- Sun Rays -->
      <circle cx="6" cy="6" r="4.5" fill="#EA580C" opacity="0.9"/>
      <!-- Radiating sun burst notches -->
      <path d="M 6,0.5 L 6,2 M 6,10 L 6,11.5 M 0.5,6 L 2,6 M 10,6 L 11.5,6 M 2.1,2.1 L 3.2,3.2 M 8.8,8.8 L 9.9,9.9 M 2.1,9.9 L 3.2,8.8 M 8.8,3.2 L 9.9,2.1" stroke="#EA580C" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Fingerprint Inner Curve -->
      <path d="M 4.5,6.5 Q 6,4.5 7.5,6.5 Q 6,8 5,6.5" fill="none" stroke="#FFFFFF" stroke-width="0.8"/>
      <!-- Text Aadhaar -->
      <text x="6" y="11.5" font-family="system-ui, sans-serif" font-size="2.6" font-weight="900" fill="#EA580C" text-anchor="middle" letter-spacing="0.2">AADHAAR</text>
    </g>

    <!-- User Photo Box (Left) -->
    <g transform="translate(3.5, 16)">
      <rect x="0" y="0" width="13" height="16.5" rx="1.5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.5"/>
      <!-- Avatar Silhouette -->
      <circle cx="6.5" cy="5.5" r="3" fill="#1E293B"/>
      <!-- Torso -->
      <path d="M 1.5,15.5 C 1.5,10.5 11.5,10.5 11.5,15.5 Z" fill="#1E293B"/>
    </g>

    <!-- Identification Details Mock Lines (Center) -->
    <g transform="translate(19, 17)">
      <rect x="0" y="0" width="14" height="2" rx="0.5" fill="#0F172A"/>
      <rect x="0" y="3.5" width="11" height="1.4" rx="0.5" fill="#64748B"/>
      <rect x="0" y="6" width="9" height="1.4" rx="0.5" fill="#64748B"/>
      <!-- Aadhaar Number (Red/Orange highlight bar) -->
      <rect x="0" y="10" width="16" height="2.2" rx="0.5" fill="#EA580C" opacity="0.85"/>
    </g>

    <!-- QR Code (Bottom Right) -->
    <g transform="translate(41.5, 23.5)">
      <rect x="0" y="0" width="14" height="12" rx="1" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.5"/>
      <!-- QR Position Corners -->
      <rect x="1.5" y="1.5" width="3.5" height="3.5" fill="#0F172A"/>
      <rect x="2.2" y="2.2" width="2.1" height="2.1" fill="#FFFFFF"/>
      <rect x="2.7" y="2.7" width="1.1" height="1.1" fill="#0F172A"/>

      <rect x="9" y="1.5" width="3.5" height="3.5" fill="#0F172A"/>
      <rect x="9.7" y="2.2" width="2.1" height="2.1" fill="#FFFFFF"/>
      <rect x="10.2" y="2.7" width="1.1" height="1.1" fill="#0F172A"/>

      <rect x="1.5" y="7" width="3.5" height="3.5" fill="#0F172A"/>
      <rect x="2.2" y="7.7" width="2.1" height="2.1" fill="#FFFFFF"/>
      <rect x="2.7" y="8.2" width="1.1" height="1.1" fill="#0F172A"/>

      <!-- QR Data dots -->
      <rect x="6.5" y="2" width="1.2" height="1.2" fill="#0F172A"/>
      <rect x="6.5" y="4.5" width="1.2" height="1.2" fill="#0F172A"/>
      <rect x="6.5" y="7" width="1.2" height="1.2" fill="#0F172A"/>
      <rect x="9" y="7" width="1.2" height="1.2" fill="#0F172A"/>
      <rect x="11" y="9" width="1.2" height="1.2" fill="#0F172A"/>
      <rect x="7" y="9.5" width="1.2" height="1.2" fill="#0F172A"/>
    </g>
  </g>
</svg>
